[project]
name = "privmrf"
version = "1.1.0"
description = "Data Synthesis via Differentially Private Markov Random Fields"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "networkx>=3.4",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x[ctk]>=13.0"]
